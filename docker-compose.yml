services:
  site-a:
    image: nginx:alpine
    container_name: site-a
    ports:
      - "8081:80"
    volumes:
      - ./site-a:/usr/share/nginx/html
    restart: always

  site-b:
    image: nginx:alpine
    container_name: site-b
    ports:
      - "8082:80"
    volumes:
      - ./site-b:/usr/share/nginx/html
    restart: always

  load-balancer:
    image: nginx:alpine
    container_name: load-balancer
    ports:
      - "8080:80"
    volumes:
      - ./load-balancer/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - site-a
      - site-b
    restart: always

